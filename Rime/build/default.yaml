recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"
schema_list:
  - schema: rime_ice
  - schema: sno_japanese
  - schema: japanese
switcher:
  abbreviate_options: true
  caption: "「方案选单」"
  fold_options: true
  hotkeys:
    - "Control+Shift+C"
    - "Alt+grave"
    - "Control+Shift+grave"
  option_list_separator: " / "
  save_options:
    - full_shape
    - ascii_punct
    - traditionalization
    - emoji